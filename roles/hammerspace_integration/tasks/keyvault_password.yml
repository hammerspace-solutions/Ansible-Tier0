---
# Fetch the Hammerspace admin password from Azure Key Vault (OPT-IN).
#
# Alternative to vars/vault.yml for sites that already manage secrets in Key
# Vault and do not want a password file on the scheduler at all.
#
# Inert unless hammerspace_keyvault_uri is set. When it is, the retrieved
# secret OVERRIDES hammerspace_api_password for the rest of the run.
#
# WHY IT RUNS AS A pre_task
# -------------------------
# plays/storage.yml authenticates against the Anvil in pre_tasks, long before
# hammerspace_integration executes. The password therefore has to be resolved
# before that preflight, which is why this file is included via include_role +
# tasks_from from each play's pre_tasks rather than from the role's main.yml.
#
# AUTHENTICATION
# --------------
# Uses the standard azure.azcollection auth chain. On a CycleCloud scheduler
# with a managed identity assigned, hammerspace_keyvault_auth_source: msi is
# the usual choice; `auto` also works but tries several sources first.
#
# The identity needs GET on secrets for the vault — either the "Key Vault
# Secrets User" RBAC role, or a `get` secret permission in the vault's access
# policy if it still uses the legacy model.
#
# no_log is set on every task that can see the secret. Do NOT remove it: the
# lookup result contains the plaintext password and would otherwise be printed
# by -v and written to the log file that scripts/run.sh configures.

- name: Verify the Key Vault secret name is set
  ansible.builtin.fail:
    msg: |
      hammerspace_keyvault_uri is set but hammerspace_keyvault_secret_name is
      not. Both are required to retrieve the password from Key Vault.

        hammerspace_keyvault_uri:         "{{ hammerspace_keyvault_uri }}"
        hammerspace_keyvault_secret_name: <unset>

      Set the secret name, or unset hammerspace_keyvault_uri to fall back to
      vars/vault.yml.
  when: (hammerspace_keyvault_secret_name | default('')) | length == 0

- name: Retrieve the Hammerspace admin password from Azure Key Vault
  azure.azcollection.azure_rm_keyvaultsecret_info:
    vault_uri: "{{ hammerspace_keyvault_uri }}"
    name: "{{ hammerspace_keyvault_secret_name }}"
    auth_source: "{{ hammerspace_keyvault_auth_source | default('auto') }}"
  register: _hs_kv_secret
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  # Read-only lookup of pre-existing state, so it must still run under --check
  # or a dry run would proceed with an empty password and fail the API
  # preflight for a reason that has nothing to do with the dry run.
  check_mode: false
  no_log: true

# The module returns `secrets` as a LIST; a missing secret yields an empty list
# rather than an error, so this is checked explicitly instead of indexing blind.
- name: Fail if the Key Vault secret was not found
  ansible.builtin.fail:
    msg: |
      Key Vault returned no secret named '{{ hammerspace_keyvault_secret_name }}'
      at {{ hammerspace_keyvault_uri }}.

      Check:
        - the secret name is exactly right (Key Vault names are case-sensitive)
        - the vault URI is the full form, e.g.
          https://my-vault.vault.azure.net
        - the identity this playbook runs as has GET on secrets for that vault
          ("Key Vault Secrets User" role, or a `get` access policy)

      Verify by hand with:
        az keyvault secret show --vault-name <vault> --name {{ hammerspace_keyvault_secret_name }} --query value -o tsv
  when: (_hs_kv_secret.secrets | default([])) | length == 0

- name: Use the Key Vault secret as the Hammerspace API password
  ansible.builtin.set_fact:
    hammerspace_api_password: "{{ _hs_kv_secret.secrets[0].secret }}"
  no_log: true

# Confirms the override happened without ever revealing the value. Length is
# reported so an operator can tell an empty or truncated secret from a good one.
- name: Confirm the password came from Key Vault
  ansible.builtin.debug:
    msg: >-
      Hammerspace API password loaded from Key Vault
      ({{ hammerspace_keyvault_uri }}, secret '{{ hammerspace_keyvault_secret_name }}',
      {{ hammerspace_api_password | length }} chars). vars/vault.yml is ignored
      for this run.
