---
# Tests for existing-mount mode: use filesystems that are ALREADY built and
# mounted instead of discovering disks and building RAID. The playbook creates
# one export directory inside each mounted path and wires NFS + Hammerspace
# around it, touching nothing else.
#
# Two things in this mode are easy to get wrong and silent when you do:
#
#   1. The `mp` export option means "only export this path if it is itself a
#      mountpoint". An export SUBDIRECTORY is not one, so leaving `mp` in place
#      produces NO export at all — /etc/exports looks right, showmount comes
#      back empty. It must become mountpoint=<parent mount>, which keeps the
#      "do not export if the array is unmounted" guarantee.
#   2. filesystem_setup runs mkfs against every mount_points entry. If it is
#      not skipped in this mode it reformats the very filesystem the operator
#      asked to reuse.
#
# Usage:
#   ansible-playbook tests/integration/test_existing_mounts.yml \
#       -i localhost, -c local

- name: Existing-mount mode tests
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars:
    _test_passes: []
    _test_failures: []

    hammerspace_export_opts: "rw,no_root_squash,sync,secure,mp,no_subtree_check"
    client_export_opts: "rw,root_squash,sync,secure,mp,no_subtree_check"

    # Two exports: a subdirectory (needs mountpoint=) and a bare mountpoint
    # (keeps mp), so both branches are exercised.
    _mp_mock:
      - path: /mnt/raid0/tier0
        parent_mount: /mnt/raid0
      - path: /mnt/raid1
        parent_mount: /mnt/raid1

  tasks:
    # ========================================================================
    # TEST 1: the `mp` -> mountpoint= swap
    # ========================================================================
    - name: 'TEST 1: mp is replaced with mountpoint= for subdirectory exports'
      block:
        - name: Compute export options the way existing_mounts.yml does
          ansible.builtin.set_fact:
            _opts: >-
              {{ _opts | default([]) + [{
                   'path': item.path,
                   'options': (hammerspace_export_opts
                               if item.path == item.parent_mount
                               else (hammerspace_export_opts.split(',')
                                     | reject('equalto', 'mp') | list
                                     + ['mountpoint=' ~ item.parent_mount]) | join(','))
                 }] }}
          loop: "{{ _mp_mock }}"
          loop_control:
            label: "{{ item.path }}"

        - name: 'TEST 1 ASSERT: subdir export drops mp and pins mountpoint='
          ansible.builtin.assert:
            that:
              - "'mp' not in (_opts[0].options.split(','))"
              - "'mountpoint=/mnt/raid0' in _opts[0].options"
              # the rest of the options must survive untouched
              - "'no_root_squash' in _opts[0].options"
              - "'no_subtree_check' in _opts[0].options"
            fail_msg: |
              REGRESSION: a subdirectory export kept the bare `mp` option, or
              lost mountpoint=. With `mp` on a non-mountpoint the export is
              silently DROPPED — /etc/exports looks correct and showmount
              returns nothing.
              Got: {{ _opts[0].options }}

        - name: 'TEST 1 ASSERT: a bare mountpoint export keeps mp untouched'
          ansible.builtin.assert:
            that:
              - "'mp' in (_opts[1].options.split(','))"
              - "'mountpoint=' not in _opts[1].options"
            fail_msg: |
              When subdir is '' the export path IS the mountpoint, so plain `mp`
              is correct and must be left alone.
              Got: {{ _opts[1].options }}

        - name: Record TEST 1 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 1: mp -> mountpoint= for subdir exports; mp kept for mountpoint exports'] }}"
      rescue:
        - name: Record TEST 1 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 1: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # TEST 2: path normalisation, including the '/' edge case
    # ========================================================================
    - name: 'TEST 2: export paths normalise correctly'
      block:
        - name: Normalise a range of entry shapes
          ansible.builtin.set_fact:
            _norm: >-
              {{ _norm | default([]) + [{
                   'in': item.p,
                   'path': _p,
                   'export_path': ((_p ~ '/' ~ item.s)
                                   | regex_replace('//+', '/')
                                   | regex_replace('/+$', ''))
                                  | default(_p, true)
                 }] }}
          loop:
            - {p: '/mnt/raid0', s: 'tier0'}     # plain
            - {p: '/mnt/raid0/', s: 'tier0'}    # trailing slash
            - {p: '/mnt/raid0', s: ''}          # no subdir -> the mount itself
            - {p: '/', s: 'tier0'}              # root (refused later, but must not blank out)
          loop_control:
            label: "{{ item.p }} + {{ item.s }}"
          vars:
            _p: "{{ (item.p | regex_replace('/+$', '')) | default(item.p, true) }}"

        - name: 'TEST 2 ASSERT: normalisation is correct in every case'
          ansible.builtin.assert:
            that:
              - _norm[0].export_path == '/mnt/raid0/tier0'
              - _norm[1].export_path == '/mnt/raid0/tier0'
              - _norm[2].export_path == '/mnt/raid0'
              # '/' | regex_replace('/+$','') is the EMPTY string. Without the
              # default(x, true) guard the refusal message printed '' and the
              # export path collapsed.
              - _norm[3].path == '/'
              - _norm[3].export_path == '/tier0'
            fail_msg: "Normalisation regression: {{ _norm }}"

        - name: Record TEST 2 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 2: path normalisation handles trailing slash, empty subdir and /'] }}"
      rescue:
        - name: Record TEST 2 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 2: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # TEST 3: system mountpoints are refused (runs the real task file)
    # ========================================================================
    - name: 'TEST 3: a system mountpoint is refused'
      block:
        - name: Point existing-mount mode at /
          ansible.builtin.include_role:
            name: nvme_discovery
            tasks_from: existing_mounts
          vars:
            existing_mount_paths: ['/']

        - name: 'TEST 3 FAIL: / was accepted as Tier 0 storage'
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 3: / was ACCEPTED as Tier 0 storage (REGRESSION — would export the OS over NFS with no_root_squash)'] }}"
      rescue:
        - name: 'TEST 3 PASS: refusal fired'
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 3: system mountpoint / refused before anything is created'] }}"

    # ========================================================================
    # TEST 4 (audit): the destructive roles must be gated off in this mode
    # ========================================================================
    - name: 'TEST 4: audit mode wiring'
      block:
        - name: Read the play and task sources
          ansible.builtin.slurp:
            src: "{{ playbook_dir }}/../../{{ item }}"
          register: _srcs
          loop:
            - plays/storage.yml
            - vars/main.yml
            - roles/nvme_discovery/tasks/existing_mounts.yml

        - name: Decode sources
          ansible.builtin.set_fact:
            _play: "{{ _srcs.results[0].content | b64decode }}"
            _vars: "{{ _srcs.results[1].content | b64decode }}"
            _task: "{{ _srcs.results[2].content | b64decode }}"

        - name: Strip comments from the play for the behavioural audit
          ansible.builtin.set_fact:
            _play_code: "{{ _play.split('\n') | reject('match', '\\s*#') | join('\n') }}"
            # The task file's header DESCRIBES what it must never do ("no mkfs,
            # no mdadm..."), so the audit has to read code, not prose.
            _task_code: "{{ _task.split('\n') | reject('match', '\\s*#') | join('\n') }}"

        - name: 'TEST 4 ASSERT: mode ships off by default'
          ansible.builtin.assert:
            that:
              - "'existing_mount_paths: []' in _vars"
            fail_msg: "existing_mount_paths must default to [] so the mode is opt-in."

        - name: 'TEST 4 ASSERT: filesystem_setup and raid_setup are gated off'
          ansible.builtin.assert:
            that:
              # filesystem_setup runs mkfs against every mount_points entry — in
              # this mode that would reformat the operator's existing array.
              - _play_code.count('existing_mount_paths | default([]) | length == 0') >= 3
              - "'role: filesystem_setup' in _play_code"
            fail_msg: |
              REGRESSION: existing-mount mode must gate OFF nvme_discovery,
              raid_setup and filesystem_setup. filesystem_setup in particular
              runs mkfs over mount_points — leaving it enabled reformats the
              filesystem the operator asked to reuse.

        - name: 'TEST 4 ASSERT: the task file never formats or mounts'
          ansible.builtin.assert:
            that:
              - "'mkfs' not in _task_code"
              - "'wipefs' not in _task_code"
              - "'mdadm' not in _task_code"
              - "'ansible.posix.mount' not in _task_code"
            fail_msg: |
              REGRESSION: existing_mounts.yml must never format, wipe, assemble
              or mount anything. Its only write is mkdir of the export directory.

        - name: Record TEST 4 pass
          ansible.builtin.set_fact:
            _test_passes: "{{ _test_passes + ['TEST 4: audit — opt-in default, destructive roles gated off, task file writes only mkdir'] }}"
      rescue:
        - name: Record TEST 4 failure
          ansible.builtin.set_fact:
            _test_failures: "{{ _test_failures + ['TEST 4: ' ~ (ansible_failed_result.msg | default('unknown') | replace('\n', ' '))] }}"

    # ========================================================================
    # Report
    # ========================================================================
    - name: Print test report
      ansible.builtin.debug:
        msg: |
          ============================================================
          EXISTING-MOUNT MODE TEST REPORT
          ============================================================
          PASSED ({{ _test_passes | length }}):
          {% for t in _test_passes %}
            ✓ {{ t }}
          {% endfor %}

          {% if _test_failures | length > 0 %}
          FAILED ({{ _test_failures | length }}):
          {% for t in _test_failures %}
            ✗ {{ t }}
          {% endfor %}
          {% else %}
          FAILED: 0
          {% endif %}
          ============================================================

    - name: Fail the play if any test failed
      ansible.builtin.fail:
        msg: "{{ _test_failures | length }} test(s) failed."
      when: _test_failures | length > 0
