---
# Azure Dynamic Inventory for Ansible
# Prerequisites:
#   ansible-galaxy collection install azure.azcollection
#   pip3 install -r ~/.ansible/collections/ansible_collections/azure/azcollection/requirements.txt
#   Configure Azure credentials
#
# Authentication options:
#   Option 1: Azure CLI - run 'az login' (auth_source: cli)
#     az login
#     az account set --subscription <subscription-id>
#   Option 2: Service principal via environment variables:
#     export AZURE_SUBSCRIPTION_ID='...'
#     export AZURE_CLIENT_ID='...'
#     export AZURE_SECRET='...'
#     export AZURE_TENANT='...'
#   Option 3: Managed identity (when running on an Azure VM) - auth_source: msi
#
# NOTE: the file MUST be named with an `azure_rm.yml` / `azure.yml` suffix for
# the plugin to be recognized. `inventory.azure.yml` matches the `azure.yml`
# suffix rule. Do NOT confuse this file with `inventory.az.yml`, which is a
# STATIC availability-zone-grouped inventory and is unrelated to Azure.
#
# Test with: ansible-inventory -i inventory.azure.yml --list

plugin: azure.azcollection.azure_rm

# Which resource groups to pull VMs from - REQUIRED: update for your environment.
# Remove this key entirely to scan the whole subscription (slower).
include_vm_resource_groups:
  - tier0-rg

# Use the bare VM name as the Ansible inventory hostname instead of the
# default "name_(resourcegroup)" form. Keeps hostnames matching the
# Hammerspace node names.
plain_host_names: true

# auto -> tries env vars, then credential profile, then CLI, then MSI.
auth_source: auto

# Only running, successfully-provisioned VMs (these are the plugin defaults;
# restated here so they are visible/editable).
exclude_host_filters:
  - "powerstate != 'running'"
  - "provisioning_state != 'succeeded'"

# Host variables consumed by the Tier 0 roles.
#
# azure_zone / azure_fault_domain feed the AZ-derivation chain in
# vars/main.yml (_cloud_az_detected). `availability_zone` is exposed by the
# azure_rm plugin from the VM's `zones` property and is null/absent for
# non-zonal VMs (availability sets, or regions without zones). In that case
# leave it unset here and enable `hammerspace_azure_imds_az: true` so the AZ
# is read from Instance Metadata Service (which also exposes the platform
# fault domain). See roles/hammerspace_integration/tasks/azure_imds_az.yml.
hostvar_expressions:
  ansible_host: private_ipv4_addresses[0]
  azure_zone: availability_zone | default(None)
  azure_vm_size: virtual_machine_size | default(None)
  azure_location: location | default(None)
  azure_resource_group: resource_group | default(None)

# Which discovered VMs become storage_servers — the group the plays target.
#
# NOTE the two filters do different jobs and are easy to conflate:
#   include_vm_resource_groups  -> what is FETCHED from Azure (cost/permission
#                                  boundary; too narrow and no expression here
#                                  can recover the missing hosts)
#   conditional_groups          -> what of the fetched set lands in the group
#
# SAFETY: whatever lands in storage_servers gets its disks discovered, RAIDed
# and mkfs'd. A filter that is too broad is DESTRUCTIVE, not just noisy — an
# unrelated VM that happens to match joins the group and loses its data. Prefer
# the narrowest expression that covers the fleet, and confirm with
# `ansible-inventory -i inventory.azure.yml --graph` before every first run
# against a new environment.
#
# Option 1 (DEFAULT — tightest): exact VM sizes. Tier 0 fleets are normally
# homogeneous, so an explicit list is both precise and self-documenting.
# `virtual_machine_size` is the SKU/size string, e.g. "Standard_L16s_v3".
conditional_groups:
  storage_servers: >-
    virtual_machine_size is defined and
    virtual_machine_size in ['Standard_L16s_v3', 'Standard_L32s_v3']

# Option 2: whole SKU FAMILY — survives adding a node of a different size in
# the same family, at the cost of sweeping in any same-family VM in the
# resource group. Matches the storage-optimized L-family (Lsv2/Lsv3/Lasv3/
# Lsv4 — local NVMe) and the NC/ND GPU families.
#   storage_servers: >-
#     virtual_machine_size is defined and
#     virtual_machine_size | regex_search('^Standard_(L[0-9]+a?s_v[0-9]+|N[CD][0-9]+)')
#
# Option 3 (SAFEST): explicit intent via a tag, optionally AND-ed with the SKU
# so a mistagged VM of the wrong size still cannot join.
#   az vm update -g <rg> -n <vm> --set tags.role=tier0
#   storage_servers: >-
#     tags.role | default('') == 'tier0' and
#     virtual_machine_size | default('') | regex_search('^Standard_L')

# conditional_groups expressions fail SILENTLY by default — a typo drops hosts
# with no error, and storage_servers just comes back empty. Set strict: true
# while debugging to turn those into hard errors.
strict: false

# Group by zone (az1, az2, ...) so on-prem-style AZ group names still work as
# a fallback AZ source, and by VM size for targeted --limit runs.
#
# EVERY key is wrapped in `| default('<fallback>', true)`. A keyed_groups key
# that evaluates to null or "" aborts the host with
#   "No key or key resulted empty for <key> in host <name>, invalid entry"
# on ansible-core <= 2.14 (newer cores skip the host silently instead — so this
# breaks on an OLD controller while looking fine on a new one). Non-zonal Azure
# VMs — availability sets, CycleCloud/HPC deployments, regions without zone
# support — report availability_zone as null, which is the common case, not an
# edge case. The `true` second argument is required: it makes `default` fire on
# falsy values (null, "") rather than only on undefined.
#
# Non-zonal hosts land in `aznone`. That group is informational only; AZ
# derivation for them comes from IMDS via hammerspace_azure_imds_az.
keyed_groups:
  - key: availability_zone | default('none', true)
    prefix: az
    separator: ''
  - key: virtual_machine_size | default('unknown', true)
    prefix: size
  - key: location | default('unknown', true)
    prefix: loc

# Cache the API results - Azure inventory calls are slow on large subscriptions.
cache: true
cache_plugin: jsonfile
cache_timeout: 300
cache_connection: /tmp/ansible_azure_inventory_cache
